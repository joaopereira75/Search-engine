# pyproject.toml
# Guardar na pasta-raiz do projeto: search/pyproject.toml
#
# Instalação de desenvolvimento (PowerShell, a partir de search/):
#   py -m pip install --upgrade pip
#   py -m pip install -e ".[test,market-data,yaml]"
#
# Testes:
#   py -m pytest -v

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asymmetry-engine"
version = "4.1.0"
description = "Scenario valuation, capital-structure and liquidity research toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Local research user" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
valuation = [
  "pandas>=2.0",
  "scipy>=1.10",
]
market-data = [
  "pandas>=2.0",
  "scipy>=1.10",
  "yfinance>=0.2.40",
  "arch>=6.3",
]
yaml = [
  "PyYAML>=6.0",
]
test = [
  "pytest>=7.4",
]
all = [
  "pandas>=2.0",
  "scipy>=1.10",
  "yfinance>=0.2.40",
  "arch>=6.3",
  "PyYAML>=6.0",
  "pytest>=7.4",
]

[tool.setuptools]
packages = ["asymmetry_engine"]

[tool.pytest.ini_options]
testpaths = ["asymmetry_engine/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
