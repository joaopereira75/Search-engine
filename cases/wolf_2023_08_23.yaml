case:
  ticker: WOLF
  company_name: Wolfspeed, Inc.
  point_in_time: "2023-08-23"
  currency: USD
  case_type: "historical validation"
  notes: >
    Caso de capacidade industrial e risco de estrutura de capital. O objetivo
    principal é testar que FCF negativo depleta o cash projetado e que uma
    maturity wall não coberta produz CAPITAL_STRUCTURE_CRISIS_RISK. A unidade
    de capacidade é uma proxy económica de receita de wafers/dispositivos.
    ASP de 5 USD produz um teto de receita de 1,8B USD: suficiente para o
    cenário Base (cerca de 1,624B USD no ano 5), mas não para o cenário Bull
    (cerca de 3,62B USD), que deve continuar fisicamente unsupported. Termos
    dos convertíveis são aproximações históricas e devem ser confirmados no
    filing original antes de uso de investimento real.

